components:
  responses:
    event:
      description: Successful response of a single Event object
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 200
              event:
                nullable: true
                $ref: "#/components/schemas/event"
            required: [code, event]
    player:
      description: Successful response of a single Player object
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 200
              player:
                nullable: true
                $ref: "#/components/schemas/player"
            required: [code, player]
    partner_server:
      description: Successful response of a single Partner Server object
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 200
              server:
                nullable: true
                $ref: "#/components/schemas/partner_server"
            required: [code, server]
    cross_ban:
      description: Successful response of a single Cross Ban object
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 200
              cross_ban:
                nullable: true
                $ref: "#/components/schemas/cross_ban"
            required: [code, cross_ban]
    partner_application:
      description: Successful response of a single Partner Application object
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 200
              partner_application:
                nullable: true
                $ref: "#/components/schemas/partner_application"
            required: [code, partner_application]
    stats:
      description: Successful response of API statistics
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 200
              stats:
                $ref: "#/components/schemas/stats"
            required: [code, stats]
    401_Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 401
              message:
                type: string
                example: Missing or invalid Authorization header
            required: [code, message]
    403_Forbidden:
      description: The authenticated user does not have permission to access the resource. Some endpoints may include a `blacklist` object when the denial is caused by an API blacklist.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 403
              message:
                type: string
                example: You do not have permission to access the resource
              blacklist:
                nullable: true
                $ref: "#/components/schemas/blacklist_entry"
            required: [code, message]
    403_Blacklisted:
      description: The authenticated user is blacklisted from using the API
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 403
              message:
                type: string
                example: You are blacklisted from using the API
              blacklist:
                $ref: "#/components/schemas/blacklist_entry"
            required: [code, message, blacklist]
    501_Not-supported:
      description: The requested feature is not yet supported
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 501
              message:
                type: string
                example: IMAGE mode is not yet supported through the API
            required: [code, message]
    503_Cooldown:
      description: The host or server is on cooldown and cannot post the event
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 503
              message:
                type: string
                example: COMMUNITY events are on cooldown
              cooldown:
                type: object
                properties:
                  ends:
                    type: string
                    example: '1736721900000'
                  remaining:
                    type: string
                    example: '60000'
                required: [ends, remaining]
            required: [code, message, cooldown]
    429_Rate-limited:
      description: Rate-limited, sent too many requests too quickly
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 429
              message:
                type: string
                default: Rate limited
            required: [code, message]
    404_Invalid-endpoint:
      description: Object not found, given invalid path parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 404
              message:
                type: string
                example: "Invalid endpoint type/value: {type}/{value}"
            required: [code, message]
    404_Not-found:
      description: The requested object could not be found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 404
              message:
                type: string
                example: Partner application not found
            required: [code, message]
    400_Invalid-value:
      description: Given invalid value, typically for a query parameter or path segment
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 400
              message:
                type: string
                example: Invalid color value
            required: [code, message]
    500_Server-error:
      description: 'The server encountered an error when serving data, please contact
        the API developers!'
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                default: 500
              message:
                type: string
                example: Encountered an exception!
            required: [code, message]
  schemas:
    event:
      type: object
      title: Event
      description: An event posted in Event Alerts
      properties:
        id:
          type: string
          pattern: '^[a-f\d]{24}$'
          example: '678443dbe2e18235b51b20fd'
        type:
          type: string
          enum: [PARTNER, COMMUNITY]
          example: 'PARTNER'
        channel:
          type: string
          description: Channel ID of the event type
          pattern: '^\d+$'
          example: '980956946075115570'
        message:
          type: string
          description: Message ID of the event's message
          pattern: '^\d+$'
          example: '1328130433971519498'
        controlPanel:
          type: string
          description: Message ID of the event's control panel
          pattern: '^\d+$'
          example: '1328130437070983198'
        custom:
          type: boolean
          example: false
        created:
          type: string
          description: When the event was posted
          pattern: '^\d{13}$'
          example: '1736721370623'
        title:
          type: string
          example: '$50 Lilypad Minigames!'
        host:
          type: string
          example: '242385234992037888'
        description:
          type: string
          example: "Step back into Summer 2016 with Lilypad's first ever Marketplace creation,\nbringing back the thrill of three beloved minigames from the classic\nXbox Minecraft days — reimagined for the latest version of the game\n\nJoin the VC too: \u003C#1315833779683590174\u003E\n\n**:sunglasses: Buy a server today at \u003Chttps://srnyx.com/lilypad\u003E**\n\n*The Lilypad Marketplace is still in beta, so bugs can be expected*"
        roles:
          type: array
          description: IDs of pinged roles
          uniqueItems: true
          items:
            type: string
            example: '970434201990070424'
          example: ['970434201990070424', '970434305203511359']
        rolesNamed:
          type: array
          description: Enum names of pinged roles
          uniqueItems: true
          items:
            type: string
            enum: [COMMUNITY, PARTNER, MONEY, FUN, HOUSING, CIVILIZATION]
            example: 'PARTNER'
          example: [PARTNER, MONEY]
        server:
          type: string
          description: ID of the Partner server hosting
          example: '6692b1e493063069af9ad3c1'
        media:
          type: object
          description: Information for the event's media file
          properties:
            url:
              type: string
              example: 'https://eventalerts.gg/api/events/6a0c7b253a21ff4c32b83413/media/event-image.png'
            name:
              type: string
              example: 'event-image.png'
        source:
          type: string
          enum: [DISCORD, API]
          example: 'DISCORD'
        ip:
          type: string
          example: 'lilypad.eventalerts.gg'
        platforms:
          type: array
          nullable: true
          uniqueItems: true
          description: Available platforms as enum values
          items:
            type: string
            enum: [JAVA, BEDROCK]
          example: [JAVA]
        platform:
          type: string
          nullable: true
          enum: ["Java", "Bedrock", "Java/Bedrock"]
          deprecated: true
          example: 'Java'
        version:
          type: string
          example: '1.21+'
        prize:
          type: string
          example: '$50 USD'
        maxPlayers:
          type: string
          pattern: '^\d+$'
          example: '100'
        time:
          type: string
          description: When the event starts
          pattern: '^\d{13}$'
          example: '1736721900000'
        subscribers:
          type: array
          description: Players following the event
          uniqueItems: true
          items:
            type: string
            example: '242385234992037888'
          example: ['242385234992037888', '365630764244664320']
        reviews:
          type: array
          nullable: true
          description: Event reviews, visible to the host or authenticated bearer requests
          items:
            type: object
            properties:
              reviewer:
                type: string
                description: Visible to bearer-authenticated requests
                example: '242385234992037888'
              timestamp:
                type: string
                pattern: '^\d{13}$'
                example: '1736721900000'
              comments:
                type: string
                nullable: true
                example: 'Great event!'
              categories:
                type: object
                description: Visible to bearer-authenticated requests
                additionalProperties:
                  type: integer
                  format: int32
                example:
                  attendance: 5
      required: [id, type, channel, custom, created, host, source]
    player:
      type: object
      title: Player
      description: A member of the Event Alerts community
      properties:
        id:
          type: string
          pattern: '^[a-f\d]{24}$'
          example: '660ef1961ec6c445f26c297a'
        discord:
          type: object
          properties:
            id:
              type: string
              example: '242385234992037888'
            username:
              type: string
              nullable: true
              example: 'srnyx'
            roles:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [ADMIN, STAFF, CREATOR, CONTRIBUTOR]
              example: [ADMIN, STAFF]
          required: [id]
        minecraft:
          type: object
          nullable: true
          properties:
            uuid:
              type: string
              example: 'e907083e-5db6-41fc-9e32-5c4d99a08712'
            username:
              type: string
              nullable: true
              example: 'srnyx'
          required: [uuid]
        anniversaries:
          type: array
          uniqueItems: true
          nullable: true
          items:
            type: integer
            format: int32
            example: 2025
          example: [2022, 2023, 2024, 2025]
        boosterPasses:
          type: array
          description: "Users they've been Booster Passes to"
          uniqueItems: true
          nullable: true
          items:
            type: string
            pattern: '^\d{18,}$'
            example: '365630764244664320'
        defaultPreset:
          type: string
          nullable: true
          pattern: '^[a-f\d]{24}$'
          example: '660ef1961ec6c445f26c297a'
        linkMethod:
          type: string
          nullable: true
          description: Only returned when authenticated as this player
          enum: [LEGACY, MICROSOFT_OAUTH, DISCORD_OAUTH, CODE_FROM_DISCORD, CODE_FROM_MINECRAFT, CROSS_BAN]
        subscription:
          type: object
          nullable: true
          properties:
            tier:
              type: string
              enum: [BEE, WASP, HORNET]
          required: [tier]
        rating:
          type: number
          format: double
          example: 4.5
      required: [id, discord]
    partner_server:
      type: object
      title: Partner Server
      description: A server that's partnered with Event Alerts
      properties:
        id:
          type: string
          pattern: '^[a-f\d]{24}$'
          example: '6692b1e493063069af9ad3c1'
        serverId:
          type: string
          nullable: true
          pattern: '^\d+$'
          description: Linked Discord server ID
          example: '970411885293895801'
        created:
          type: string
          description: When the server was first created/partnered
          pattern: '^\d{13}$'
          example: '1720889828797'
        representatives:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^\d{18,}$'
            example: '242385234992037888'
          example: ['273538684526264320', '533985117589471233', '242385234992037888']
        enabled:
          type: string
          nullable: true
          description: When the server was last enabled
          example: '1752472796403'
        name:
          type: string
          nullable: true
          example: 'srnyx silly events'
        description:
          type: string
          nullable: true
          example: 'the silliest of events!!!! :))'
        invite:
          type: string
          description: "Invite CODE to the server's Discord"
          nullable: true
          example: 'MDxM9TWERP'
        thumbnail:
          type: string
          pattern: '^https?://.+'
          nullable: true
          example: 'https://media.srnyx.com/r/circle.png'
        color:
          type: integer
          format: int32
          nullable: true
          example: 4360181
        tags:
          type: array
          nullable: true
          items:
            type: string
            enum: [CIVILIZATION, FUN, HYPIXEL, LUCK, MINEHUT, MONEY, PVP, SKILL, STREAMS, VIDEOS]
            example: 'SKILL'
          example: [SKILL, PVP, FUN]
        message:
          type: string
          nullable: true
          pattern: '^\d{18,}$'
          example: '1394196700280651933'
        gets:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            format: int32
          example:
            "365630764244664320": 2
            "381890968971902976": 5
        disableData:
          type: object
          nullable: true
          description: Only visible when authenticated as the partner server
          properties:
            reason:
              type: string
              example: 'Server is disabled'
            time:
              type: string
              pattern: '^\d{13}$'
              example: '1752472796403'
        apiKey:
          type: string
          nullable: true
          description: Only visible to the bearer-authenticated server owner
      required: [id, created, representatives]
    cross_ban:
      type: object
      title: Cross Ban
      description: A cross-ban issued across Event Alerts
      properties:
        id:
          type: string
          pattern: '^[a-f\d]{24}$'
          example: '678443dbe2e18235b51b20fd'
        discordId:
          type: string
          nullable: true
          pattern: '^\d+$'
          example: '242385234992037888'
        minecraftUuid:
          type: string
          nullable: true
          example: 'e907083e-5db6-41fc-9e32-5c4d99a08712'
        reason:
          type: string
          example: 'Spamming events across multiple servers'
        expiration:
          type: string
          nullable: true
          pattern: '^\d{13}$'
          example: '1736721900000'
        created:
          type: string
          pattern: '^\d{13}$'
          example: '1736721370623'
