openapi: 3.1.1
info:
  version: 1.0.0
  title: Event Alerts
  summary: Official API for the Event Alerts Discord community for the best
    Minecraft events
  description: "The Event Alerts API is the best thing to use if you're looking
    for Minecraft event-related data\r
    \r
    We primarily offer information regarding the [Event Alerts
    Discord](https://discord.gg/skeppy), which includes websockets for Minecraft
    events being announced/posted\r
    \r
    Feel free to join the Discord and ask us any questions about the API!\r
    \r
    ## Important API information\r
    \r
    All Discord IDs, timestamps, etc... (anything that uses Java's `long` type)
    are **strings**. JavaScript, and other languages, like to round these
    numbers, so we have to send/accept them as strings."
  contact:
    name: Event Alerts
    url: https://eventalerts.gg
    email: contact@eventalerts.gg
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://eventalerts.gg/api/v1
    description: Event Alerts API
  - url: https://eventalerts.venox.network/api/v1
    description: Deprecated API address (use eventalerts.gg)
tags:
  - name: events
    description: All events ever posted in Event Alerts
  - name: cross_bans
    description: All cross-bans ever recorded in Event Alerts
  - name: players
    description: Members of the Event Alerts community
  - name: servers
    description: Partnered Event Alerts servers
  - name: partner_applications
    description: Partner server applications currently or previously submitted
  - name: stats
    description: High-level API statistics
paths:
  /events:
    get:
      tags: [events]
      summary: Get all Events
      description: Get all events ever posted with filtering parameters
      operationId: getEvents
      parameters:
        - name: page
          in: query
          example: 5
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: limit
          in: query
          example: 30
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Field to sort by, prefix with `-` for descending
          example: '-created'
          schema:
            type: string
            enum: [type, channel, custom, created, title, host, description, roles, server, media_name, ip, platform, platforms, version, prize, maxPlayers, time, subscribers, effective_date, -type, -channel, -custom, -created, -title, -host, -description, -roles, -server, -media_name, -ip, -platform, -platforms, -version, -prize, -maxPlayers, -time, -subscribers, -effective_date]
        - name: type
          in: query
          example: 'PARTNER'
          schema:
            type: string
            enum: [PARTNER, COMMUNITY]
        - name: channel
          in: query
          example: '980956946075115570'
          schema:
            type: string
        - name: custom
          in: query
          example: false
          schema:
            type: boolean
        - name: created
          in: query
          allowEmptyValue: true
          example: '1736721370623'
          schema:
            type: string
            description: Epoch millis as string (filter or sort)
        - name: created_before
          in: query
          example: '1736721370623'
          schema:
            type: string
            description: Epoch millis as string
        - name: created_after
          in: query
          example: '1736721370623'
          schema:
            type: string
            description: Epoch millis as string
        - name: title
          in: query
          description: Substring match
          example: "Minigames"
          schema:
            type: string
        - name: host
          in: query
          example: '242385234992037888'
          schema:
            type: string
        - name: description
          in: query
          description: Substring match
          example: "Marketplace"
          schema:
            type: string
        - name: roles
          in: query
          description: All must be present
          explode: false
          example: ['970434201990070424', '970434305203511359']
          schema:
            type: array
            items:
              type: string
        - name: rolesNamed
          in: query
          description: All must be present
          explode: false
          example: [PARTNER, MONEY]
          schema:
            type: array
            items:
              type: string
              enum: [COMMUNITY, PARTNER, MONEY, FUN, HOUSING, CIVILIZATION]
        - name: server
          in: query
          example: '6692b1e493063069af9ad3c1'
          schema:
            type: string
        - name: media_name
          in: query
          description: Substring match or media present if no value
          example: 'png'
          schema:
            type: string
        - name: ip
          in: query
          description: Substring match
          example: 'play.hosting'
          schema:
            type: string
        - name: platform
          in: query
          description: Legacy single-platform filter
          example: 'Java'
          schema:
            type: string
            enum: ['Java', 'Bedrock', 'Java/Bedrock']
          deprecated: true
        - name: platforms
          in: query
          description: All must be present
          explode: false
          example: [JAVA, BEDROCK]
          schema:
            type: array
            items:
              type: string
              enum: [JAVA, BEDROCK]
        - name: version
          in: query
          example: '1.21'
          schema:
            type: string
        - name: prize
          in: query
          description: Substring match
          example: 'USD'
          schema:
            type: string
        - name: maxPlayers
          in: query
          example: 100
          schema:
            type: integer
            format: int32
        - name: time
          in: query
          example: '1736721900000'
          schema:
            type: string
        - name: time_before
          in: query
          example: '1736721900000'
          schema:
            type: string
        - name: time_after
          in: query
          example: '1736721900000'
          schema:
            type: string
        - name: subscribers
          in: query
          description: At least one present
          explode: false
          example: ['242385234992037888', '365630764244664320']
          schema:
            type: array
            items:
              type: string
        - name: reviews
          in: query
          description: Presence-only flag; only returns events that have reviews
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    default: 200
                  page:
                    type: integer
                    format: int32
                    default: 1
                  limit:
                    type: integer
                    format: int32
                    default: 50
                  count:
                    type: integer
                    format: int32
                    example: 1
                  total:
                    type: integer
                    format: int32
                    example: 1
                  all:
                    type: integer
                    format: int32
                    example: 1
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/event"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
    post:
      tags: [events]
      summary: Post an Event
      description: |
        Post an event through the API.

        Requires a valid `X-Player-Key`. If `type` is `PARTNER`, a valid `X-Server-Key` is also required.
        Request bodies must match the current event builder/custom rules enforced by the API handler.
      operationId: postEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [PARTNER, COMMUNITY]
                  example: 'PARTNER'
                custom:
                  type: boolean
                  example: false
                mode:
                  type: string
                  enum: [TEXT, IMAGE]
                  default: TEXT
                  description: IMAGE is currently not supported through the API
                  example: 'TEXT'
                title:
                  type: string
                  nullable: true
                  example: '$50 Lilypad Minigames!'
                description:
                  type: string
                  nullable: true
                  example: "Step back into Summer 2016 with Lilypad's first ever Marketplace creation"
                roles:
                  type: array
                  nullable: true
                  description: Ping roles for the event
                  example: [PARTNER, MONEY]
                  items:
                    type: string
                    enum: [COMMUNITY, PARTNER, MONEY, FUN, HOUSING, CIVILIZATION]
                ip:
                  type: string
                  nullable: true
                  example: 'lilypad.eventalerts.gg'
                platform:
                  type: array
                  nullable: true
                  description: Legacy request field used by the API handler
                  uniqueItems: true
                  example: [JAVA]
                  items:
                    type: string
                    enum: [JAVA, BEDROCK]
                version:
                  type: string
                  nullable: true
                  example: '1.21+'
                prize:
                  type: string
                  nullable: true
                  example: '$50 USD'
                maxPlayers:
                  type: integer
                  format: int32
                  nullable: true
                  example: 100
                time:
                  type: string
                  nullable: true
                  description: Epoch millis as a string
                  pattern: '^\d{13}$'
                  example: '1736721900000'
              required: [type, custom]
      responses:
        "200":
          $ref: "#/components/responses/event"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "403":
          $ref: "#/components/responses/403_Forbidden"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
        "501":
          $ref: "#/components/responses/501_Not-supported"
        "503":
          $ref: "#/components/responses/503_Cooldown"
  /events/id/{id}:
    get:
      tags: [events]
      summary: Get Event by Object ID
      description: Get a specific event by it's Object ID
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          example: '678443dbe2e18235b51b20fd'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/event"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /events/message/{message}:
    get:
      tags: [events]
      summary: Get Event by Discord message ID
      description: "Get a specific Event by it's Discord message ID"
      operationId: getEventByMessage
      parameters:
        - name: message
          in: path
          description: Discord message ID
          required: true
          example: '1328130433971519498'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/event"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /events/controlPanel/{controlPanel}:
    get:
      tags: [events]
      summary: "Get Event by Discord message ID of the event's control panel"
      description: "Get a specific Event by the Discord message ID of it's control panel"
      operationId: getEventByControlPanel
      parameters:
        - name: controlPanel
          in: path
          description: Discord message ID
          required: true
          example: '1328130437070983198'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/event"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /cross_bans:
    get:
      tags: [cross_bans]
      summary: Get all Cross Bans
      description: Get all cross bans ever recorded with filtering parameters
      operationId: getCrossBans
      parameters:
        - name: page
          in: query
          example: 5
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: limit
          in: query
          example: 30
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Field to sort by, prefix with `-` for descending
          example: '-created'
          schema:
            type: string
            enum: [id, discord_id, minecraft_uuid, reason, expiration, created, -id, -discord_id, -minecraft_uuid, -reason, -expiration, -created]
        - name: id
          in: query
          description: All must be present
          explode: false
          example: ['678443dbe2e18235b51b20fd']
          schema:
            type: array
            items:
              type: string
        - name: discord_id
          in: query
          description: All must be present
          explode: false
          example: ['242385234992037888']
          schema:
            type: array
            items:
              type: string
        - name: minecraft_uuid
          in: query
          description: All must be present
          explode: false
          example: ['e907083e-5db6-41fc-9e32-5c4d99a08712']
          schema:
            type: array
            items:
              type: string
        - name: reason
          in: query
          description: Substring match
          example: "spam"
          schema:
            type: string
        - name: expiration
          in: query
          example: '1736721900000'
          schema:
            type: string
        - name: created
          in: query
          example: '1736721900000'
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    default: 200
                  page:
                    type: integer
                    format: int32
                    default: 1
                  limit:
                    type: integer
                    format: int32
                    default: 50
                  count:
                    type: integer
                    format: int32
                    example: 1
                  total:
                    type: integer
                    format: int32
                    example: 1
                  all:
                    type: integer
                    format: int32
                    example: 1
                  cross_bans:
                    type: array
                    items:
                      $ref: "#/components/schemas/cross_ban"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /cross_bans/id/{id}:
    get:
      tags: [cross_bans]
      summary: Get Cross Ban by Object ID
      description: Get a specific cross ban by its Object ID
      operationId: getCrossBanById
      parameters:
        - name: id
          in: path
          required: true
          example: '678443dbe2e18235b51b20fd'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/cross_ban"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /cross_bans/discord_id/{discord_id}:
    get:
      tags: [cross_bans]
      summary: Get Cross Ban by Discord user ID
      description: Get a specific cross ban by its Discord user ID
      operationId: getCrossBanByDiscordId
      parameters:
        - name: discord_id
          in: path
          required: true
          example: '242385234992037888'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/cross_ban"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /cross_bans/minecraft_uuid/{minecraft_uuid}:
    get:
      tags: [cross_bans]
      summary: Get Cross Ban by Minecraft UUID
      description: Get a specific cross ban by its Minecraft UUID
      operationId: getCrossBanByMinecraftUuid
      parameters:
        - name: minecraft_uuid
          in: path
          required: true
          example: 'e907083e-5db6-41fc-9e32-5c4d99a08712'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/cross_ban"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /players:
    get:
      tags: [players]
      summary: Get all Players
      description: Get all registered Event Alerts players with filtering parameters
      operationId: getPlayers
      parameters:
        - name: page
          in: query
          example: 5
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: limit
          in: query
          example: 30
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Field to sort by, prefix with `-` for descending
          example: '-rating'
          schema:
            type: string
            enum: [id, discord_id, discord_username, minecraft_uuid, minecraft_username, anniversaries, boosterPasses, subscription, subscription_tier, linkMethod, rating, -id, -discord_id, -discord_username, -minecraft_uuid, -minecraft_username, -anniversaries, -boosterPasses, -subscription, -subscription_tier, -linkMethod, -rating]
        - name: discord_username
          in: query
          example: 'srnyx'
          schema:
            type: string
        - name: minecraft_uuid
          in: query
          example: 'e907083e-5db6-41fc-9e32-5c4d99a08712'
          schema:
            type: string
        - name: minecraft_username
          in: query
          example: 'srnyx'
          schema:
            type: string
        - name: anniversaries
          in: query
          description: Must have all
          explode: false
          example: [2022, 2023, 2024, 2025]
          schema:
            type: array
            items:
              type: integer
              format: int32
        - name: boosterPasses
          in: query
          description: Must have all
          explode: false
          example: ['365630764244664320']
          schema:
            type: array
            items:
              type: string
        - name: subscription_tier
          in: query
          description: Checks if present if no value
          example: 'BEE'
          schema:
            type: string
            enum: [BEE, WASP, HORNET]
        - name: subscription
          in: query
          description: Legacy alias of subscription_tier
          example: 'BEE'
          deprecated: true
          schema:
            type: string
            enum: [BEE, WASP, HORNET]
        - name: linkMethod
          in: query
          example: 'DISCORD_OAUTH'
          schema:
            type: string
            enum: [LEGACY, MICROSOFT_OAUTH, DISCORD_OAUTH, CODE_FROM_DISCORD, CODE_FROM_MINECRAFT, CROSS_BAN]
        - name: rating
          in: query
          description: Greater than or equal to
          example: 2.7
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    default: 200
                  page:
                    type: integer
                    format: int32
                    default: 1
                  limit:
                    type: integer
                    format: int32
                    default: 50
                  count:
                    type: integer
                    format: int32
                    example: 1
                  total:
                    type: integer
                    format: int32
                    example: 1
                  all:
                    type: integer
                    format: int32
                    example: 1
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/player"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /players/id/{id}:
    get:
      tags: [players]
      summary: Get Player by Object ID
      description: Get a specific Player by their Object ID
      operationId: getPlayerById
      parameters:
        - name: id
          in: path
          required: true
          example: '660ee99164e47b491692f04a'
          schema:
            type: string
            pattern: '^[a-f\d]{24}$'
      responses:
        "200":
          $ref: "#/components/responses/player"
        "400":
          $ref: "#/components/responses/400_Invalid-value"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /players/discord/id/{id}:
    get:
      tags: [players]
      summary: Get Player by Discord user ID
      description: Get a specific Player by their Discord user ID
      operationId: getPlayerByDiscordId
      parameters:
        - name: id
          in: path
          required: true
          example: '242385234992037888'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/player"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /players/minecraft/uuid/{uuid}:
    get:
      tags: [players]
      summary: Get Player by Minecraft UUID
      description: Get a specific Player by their Minecraft UUID
      operationId: getPlayerByMinecraftUuid
      parameters:
        - name: uuid
          in: path
          required: true
          example: 'e907083e-5db6-41fc-9e32-5c4d99a08712'
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/player"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /players/regenerate-key:
    post:
      tags: [players]
      summary: Regenerate Player API key
      description: Regenerate a player's API key using the admin bearer token
      operationId: postPlayerRegenerateKey
      requestBody:
        required: false
        description: Optional fallback when X-Player-Key is not available
        content:
          application/json:
            schema:
              type: object
              properties:
                player:
                  type: string
                  description: Player object id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    default: 200
                  newKey:
                    type: string
                required: [code, newKey]
        "401":
          $ref: "#/components/responses/401_Unauthorized"
        "403":
          $ref: "#/components/responses/403_Blacklisted"
        "429":
          $ref: "#/components/responses/429_Rate-limited"
        "500":
          $ref: "#/components/responses/500_Server-error"
  /servers:
    get:
      tags: [servers]
      summary: Get all Partner Servers
      description: Get all current Partner Servers with filtering parameters
      operationId: getServers
      parameters:
        - name: page
          in: query
          example: 5
          schema:
            type: integer
            format: int32
            default: 1
            minimum: 1
        - name: limit
          in: query
          example: 30
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Field to sort by, prefix with `-` for descending
          example: '-created'
          schema:
            type: string
            enum: [id, server_id, created, representatives, enabled, name, description, invite, tags, color, thumbnail, message, gets, -id, -server_id, -created, -representatives, -enabled, -name, -description, -invite, -tags, -color, -thumbnail, -message, -gets]
        - name: created
          in: query
          example: '1720889828797'
          schema:
            type: string
        - name: representatives
          in: query
          description: All must be present
          example: ['273538684526264320', '533985117589471233', '242385234992037888']
          schema:
            type: array
            items:
              type: string
        - name: enabled
          in: query
          example: '1752472796403'
          schema:
            type: string
        - name: name
          in: query
          description: Exact match
          example: 'srnyx silly events'
          schema:
            type: string
        - name: description
          in: query
          description: Exact match
          example: 'the silliest of events!!!! :))'
          schema:
            type: string
        - name: invite
          in: query
          description: Exact match
          example: 'MDxM9TWERP'
          schema:
            type: string
        - name: tags
          in: query
          description: All must be present
          example: [SKILL, PVP, FUN]
          schema:
            type: array
            items:
              type: string
              enum: [CIVILIZATION, FUN, HYPIXEL, LUCK, MINEHUT, MONEY, PVP, SKILL, STREAMS, VIDEOS]
        - name: color
          in: query
          description: RGB integer
          example: 4360181
          schema:
            type: integer
            format: int32
        - name: thumbnail
