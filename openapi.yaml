          description: Exact match
          example: 'https://media.srnyx.com/r/circle.png'
          schema:
            type: string
        - name: gets
          in: query
          description: Keys contain all
          example: ['365630764244664320', '381890968971902976']
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
