                    type: integer
                    format: int32
                    default: 1
                  limit:
                    type: integer
                    format: int32
                    default: 50
                  count:
                    type: integer
                    format: int32
                    example: 1
                  total:
                    type: integer
                    format: int32
                    example: 1
                  all:
                    type: integer
                    format: int32
                    example: 1
